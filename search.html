<!doctype html>
<meta charset="utf-8" />
<title>Product Search</title>
<style>
  body{margin:0;font:14px/1.4 system-ui,Roboto,Arial}
  .bar{padding:10px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff}
  input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
  .list{padding:10px}
  .item{display:flex;gap:12px;padding:10px;border-bottom:1px solid #eee;cursor:pointer}
  .item:hover{background:#f7f7f9}
  .thumb{width:56px;height:56px;object-fit:cover;border-radius:6px}
  .name{font-weight:600}
  .price{opacity:.8}
  dialog{border:none;border-radius:12px;max-width:900px;width:92%}
  model-viewer{width:100%;height:380px}
  .btns{display:flex;gap:8px;margin-top:8px}
  .btn{padding:8px 12px;border:1px solid #ccc;border-radius:8px;cursor:pointer;background:#fff}
</style>

<div class="bar"><input id="q" placeholder="Tìm theo tên, mã, từ khóa…" autofocus /></div>
<div id="list" class="list"></div>

<!-- model-viewer only loads if you actually use a .glb -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script>
let DATA = [];
const list = document.getElementById('list');
const q = document.getElementById('q');

async function load() {
  const res = await fetch('products.json');
  DATA = await res.json();
  render();
}
function vnd(n){return n.toLocaleString('vi-VN')+' đ';}
function render() {
  const s = q.value.trim().toLowerCase();
  const items = DATA.filter(p =>
    !s || [p.id,p.name,p.keywords].join(' ').toLowerCase().includes(s)
  );
  list.innerHTML = items.map(p=>`
    <div class="item" data-id="${p.id}">
      <img class="thumb" src="${p.thumb||''}">
      <div>
        <div class="name">${p.name}</div>
        <div class="price">${vnd(p.price)}</div>
        <div class="meta">${p.id}</div>
      </div>
    </div>`).join('');
  [...list.querySelectorAll('.item')].forEach(el=>{
    el.onclick = ()=>{
      const p = DATA.find(x=>x.id===el.dataset.id);
      // 1) tell tour to jump + set variables for in-tour panel
      parent.postMessage({from:'product-search',type:'goto',
        node:p.node,yaw:p.yaw,pitch:p.pitch,fov:p.fov}, '*');
      parent.postMessage({from:'product-search',type:'setvars',
        name:p.name, price:vnd(p.price), desc:p.desc||'',
        image:p.thumb||'', model:p.model||null }, '*');
    };
  });
}
q.oninput = render;
load();
</script>
